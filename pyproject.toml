[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bip"
version = "0.1.0"
description = "Biometric Integration Platform — multi-tenant service connecting biometric attendance terminals to consumer applications"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
authors = [{ name = "BIP Team" }]
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.5.0,<3.0",
    "sqlalchemy[asyncio]>=2.0.35,<3.0",
    "asyncpg>=0.30.0,<1.0",
    "alembic>=1.14.0,<2.0",
    "httpx>=0.27.0,<1.0",
    "structlog>=24.4.0,<25.0",
    "jinja2>=3.1.4,<4.0",
    "cryptography>=43.0.0,<45.0",
    "argon2-cffi>=23.1.0,<24.0",
    "pyotp>=2.9.0,<3.0",
    "rapidfuzz>=3.10.0,<4.0",
    "openpyxl>=3.1.5,<4.0",
    "python-multipart>=0.0.12,<1.0",
    "pyjwt>=2.9.0,<3.0",
    "pyyaml>=6.0.2,<7.0",
]

[project.optional-dependencies]
pyzk = ["pyzk==0.9"]
db_read = ["pyodbc>=5.1.0,<6.0"]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "respx>=0.21.0,<1.0",
    "httpx>=0.27.0,<1.0",
    "ruff>=0.7.0,<1.0",
    "mypy>=1.12.0,<2.0",
    "coverage>=7.6.0,<8.0",
    "aiosqlite>=0.20.0,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bip"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "clients/python"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["bip", "bip_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: unit tests (no external deps)",
    "integration: requires database",
    "e2e: end-to-end tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["bip.sdk.*", "bip.core.*"]
strict = true
