{% extends "ops_base.html" %}
{% block title %}Two-Factor Authentication — BIP Ops{% endblock %}
{% block auth_content %}
<style>
  .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
  .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 40px; width: 380px; }
  .login-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .login-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 28px; }
  .totp-hint { font-size: 12px; color: var(--text-muted); margin-top: 12px; text-align: center; }
</style>
<div class="login-wrap">
  <div class="login-card">
    <div style="font-size:28px; margin-bottom:12px;">🔑</div>
    <div class="login-title">Two-Factor Auth</div>
    <div class="login-sub">Enter the 6-digit code from your authenticator app</div>
    {% if error %}
      <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/ops/totp">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <div class="form-group">
        <label>TOTP Code</label>
        <input class="form-control" type="text" name="totp_code" id="totp_code"
               pattern="[0-9]{6}" maxlength="6" required autofocus
               placeholder="000000" style="font-size:24px; letter-spacing: 8px; text-align: center;" />
      </div>
      <button class="btn btn-primary" style="width:100%; justify-content:center;" type="submit">Verify</button>
    </form>
    <div class="totp-hint"><a href="/ops/logout">← Sign in with different account</a></div>
  </div>
</div>
{% endblock %}
