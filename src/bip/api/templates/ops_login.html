{% extends "ops_base.html" %}
{% block title %}Sign In — BIP Ops{% endblock %}
{% block auth_content %}
<style>
  .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
  .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 40px; width: 380px; }
  .login-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .login-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 28px; }
</style>
<div class="login-wrap">
  <div class="login-card">
    <div style="font-size:28px; margin-bottom:12px;">🔐</div>
    <div class="login-title">BIP Ops Console</div>
    <div class="login-sub">Sign in with your admin credentials</div>
    {% if error %}
      <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <a href="/ops/quick-login" class="btn btn-primary" style="width:100%; justify-content:center; padding:12px; font-size:14px; font-weight:600; margin-bottom:20px; background:linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); border:none; box-shadow:0 4px 12px rgba(99,102,241,0.3);">
      ⚡ 1-Click Instant Login (Admin)
    </a>

    <div style="display:flex; align-items:center; gap:12px; margin-bottom:20px;">
      <div style="flex:1; height:1px; background:var(--border);"></div>
      <div style="font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px;">or sign in with password</div>
      <div style="flex:1; height:1px; background:var(--border);"></div>
    </div>

    <form method="post" action="/ops/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <div class="form-group">
        <label>Email address</label>
        <input class="form-control" type="email" name="email" id="email" required autofocus value="{{ email or '' }}" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input class="form-control" type="password" name="password" id="password" required />
      </div>
      <button class="btn btn-primary" style="width:100%; justify-content:center;" type="submit">Continue →</button>
    </form>
  </div>
</div>
{% endblock %}
